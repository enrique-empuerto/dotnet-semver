name: .NET Core 10 CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' 
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages  
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache    
  DOTNET_VERSION: '10.0.x'
  VERLITE_VERSION: '"2.6.0"'
  APP_NAME: 'dotnet-semver'

jobs:
  check-branch:
    runs-on: self-hosted
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: vars
        run: |
          # Finds remote branches containing the tag, strips 'origin/', and takes the first match
          BRANCH=$(git branch -r --contains ${{ github.ref }} | head -n 1 | sed 's/.*origin\///')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Use branch name
        run: echo "Running on branch ${{ steps.vars.outputs.branch }}"

  build-and-test-and-publish:
    runs-on: self-hosted
    needs: check-branch
    if: needs.check-branch.outputs.branch == 'main'    
    steps:  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4 # Sets up the .NET SDK
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet        
        with: 
          dotnet-version: ${{ env.DOTNET_VERSION }} # Specify your .NET version

      - name: Restore dependencies
        run: dotnet restore # Restores NuGet packages

      - name: install verlite for semantic versioning
        run: |
          dotnet tool install --global Verlite.CLI --version ${{ env.VERLITE_VERSION }}
          export PATH="$PATH:/home/dev1/.dotnet/tools"
          verlite --auto-fetch

      - name: Build
        run: dotnet build --no-restore --configuration Release # Compiles the app

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal        

      - name: Publish Application
        run: dotnet publish -c Release -o ./publish    

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-publish
          path: ./publish             

